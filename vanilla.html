<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Vanilla JS: обробка подій</title>
  </head>
  <body>
    <div class="event-card">
      <h3>React Meetup Lviv</h3>
      <label for="going-checkbox">Піду</label>
      <input type="checkbox" id="going-checkbox" />
    </div>
    <script>
      const goingCheckbox = document.getElementById('going-checkbox');

      function handleGoingChange(event) {
        console.log('Статус відвідування змінено! ', event);
      }

      goingCheckbox.addEventListener('change', handleGoingChange);
    </script>
  </body>
</html>
